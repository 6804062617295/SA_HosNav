states:
  - entity: Queue
    states:
      - name: Waiting
      - name: Called
      - name: Processing
      - name: Completed
      - name: Skipped
    transitions:
      - from: Waiting
        to: Called
        trigger: Staff calls queue
        guard: null
      - from: Called
        to: Processing
        trigger: Patient arrives
        guard: null
      - from: Called
        to: Skipped
        trigger: Patient no-show
        guard: null
      - from: Processing
        to: Completed
        trigger: Service done
        guard: null
    source: AGENTS.md section 6

business_rules:
  - id: BR-1
    description: Queue system supports only Waiting, Called, Processing, Completed, Skipped.
    source: AGENTS.md section 6
  - id: BR-2
    description: Backend authorization is mandatory, using Role-Based Access Control.
    source: AGENTS.md section 9
